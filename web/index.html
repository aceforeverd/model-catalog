<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Model Catalog</title>
<!-- The stored theme and the chosen view (URL first, then storage), applied
     before first paint. -->
<script>
  try {
    var d = document.documentElement, t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") d.dataset.theme = t;
    var v = new URLSearchParams(location.search).get("view") || localStorage.getItem("view");
    if (v === "cards") d.dataset.view = v;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/src/site.css">
</head>
<body>
<div id="root"></div>
<noscript><p class="wrap">This catalog needs JavaScript to show. The catalog itself is <a href="index.json">index.json</a>.</p></noscript>
<script type="module" src="/src/entries/models.tsx"></script>
</body>
</html>
